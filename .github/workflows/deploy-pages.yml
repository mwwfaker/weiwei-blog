name: Publish blog preview

on:
  push:
    branches: [main]
    paths: ['frontend/**', '.github/workflows/deploy-pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      # 静态检查 + 三个离线自检（歌词解析 / 绩效公式 / 导入解析器）。
      # 它们全都在 frontend/scripts/ 下，所以工作目录统一是 frontend。
      - run: npm run verify:all
        working-directory: frontend
      - run: npm run test:render
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
        env:
          # Supabase 的连接信息（账号 / 数据库 / 对象存储）在构建时注入。
          # 这两个值本来就是公开的（anon/publishable key 设计上就要放在前端代码里），
          # 但 value 仍然放在仓库 Variables 里，方便换项目时不用改代码。
          # 没设置时前端进入本机预览模式，数据只留在访客浏览器里。
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          # 可选：中文歌词源的中转地址（Supabase Edge Function，见 supabase/functions/lyrics）。
          # 不设置就只用 LRCLIB 自动匹配 + 手动粘贴，功能正常。
          VITE_LYRICS_PROXY: ${{ vars.VITE_LYRICS_PROXY }}
          # 可选：立体浏览的深度模型放在哪。不设置就从 HuggingFace 取（国内慢）。
          # 模型放在自己项目的公开桶 weiwei-assets/models/ 下时，两条都要给：
          #   VITE_DEPTH_MODEL_HOST=https://<项目>.supabase.co/storage/v1/object/public/weiwei-assets/models
          #   VITE_DEPTH_MODEL_PATH_TEMPLATE={model}/{file}
          # 只换镜像站（目录形状与 HuggingFace 相同）时，第二条留空即可。
          VITE_DEPTH_MODEL_HOST: ${{ vars.VITE_DEPTH_MODEL_HOST }}
          VITE_DEPTH_MODEL_PATH_TEMPLATE: ${{ vars.VITE_DEPTH_MODEL_PATH_TEMPLATE }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
