spring:
  application:
    name: weiwei-blog-api
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/weiwei_blog?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:change-me}
  jpa:
    hibernate:
      # Flyway owns the schema; validate only checks that the entities match it.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  # `server.error.include-message` was renamed in Boot 4. Without this, Spring drops every
  # ResponseStatusException reason and the login form can only report a bare status code.
  web:
    error:
      include-message: always
server:
  port: ${PORT:8080}
app:
  # APP_JWT_SECRET has no default on purpose: the service must not start with a known secret.
  # It must be at least 32 UTF-8 bytes, or startup fails with an explicit error.
  jwt-secret: ${APP_JWT_SECRET}
  cors-origin: ${CORS_ORIGIN:http://localhost:5173}
  storage:
    endpoint: ${S3_ENDPOINT:http://localhost:9000}
    region: ${S3_REGION:us-east-1}
    bucket: ${S3_BUCKET:weiwei-media}
    access-key: ${S3_ACCESS_KEY:minioadmin}
    secret-key: ${S3_SECRET_KEY:local-minio-secret-change-this}
